<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNHCR.pi - Pi Network Utility App</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  
  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    // Initialize Pi SDK
    Pi.init({ version: "2.0", sandbox: true });

    async function unlockUtility() {
      try {
        // 1️⃣ Authenticate the user
        const auth = await Pi.authenticate(
          ["username", "payments"],
          function (payment) {
            console.log("Incomplete payment detected", payment);
          }
        );
        console.log("User authenticated:", auth);

        // 2️⃣ Trigger payment
        const payment = await Pi.createPayment(
          {
            amount: 0.01,
            memo: "Unlock utility access",
            metadata: { app: "UNHCR.pi", feature: "utility_access" }
          },
          {
            onReadyForServerApproval: (paymentId) => {
              fetch("/functions/approve", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ paymentId })
              });
            },
            onReadyForServerCompletion: (paymentId, txid) => {
              fetch("/functions/complete", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ paymentId, txid })
              });
            },
            onCancel: (paymentId) => {
              console.log("Payment cancelled", paymentId);
            },
            onError: (error) => {
              console.error("Payment error", error);
            }
          }
        );

      } catch (err) {
        console.error("Authentication or payment failed", err);
        alert("Unable to process Testnet payment. Please try again.");
      }
    }
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f6f8fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      text-align: center;
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 400px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      color: #1e90ff;
    }
    p {
      font-size: 16px;
      margin-bottom: 24px;
      color: #333;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #1e90ff;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0d6efd;
    }
    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="UNHCR.pi Logo" width="80">
    <h1>UNHCR.pi</h1>
    <p>A Pi Network ecosystem application providing Pi-native web naming utilities, structured digital tools, and domain-based services.</p>
    <button onclick="unlockUtility()">
      Unlock Utility Access (0.01 Pi • Testnet)
    </button>
    <footer>
      Testnet Only • No real funds
    </footer>
  </div>
</body>
</html>

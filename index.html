<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UNHCR.pi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Pi SDK (OFFICIAL) -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      text-align: center;
      padding: 40px 20px;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      max-width: 420px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    button {
      background: #6a0dad;
      color: #fff;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }
    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    .log {
      font-size: 12px;
      margin-top: 15px;
      color: #444;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>UNHCR.pi</h2>

    <p>
      Pi-native web naming, domain utilities, and digital services
      for scalable, ecosystem-ready projects.
    </p>

    <button id="authBtn">Authenticate with Pi</button>
    <button id="payBtn" disabled>
      Unlock Utility Access (0.01 Pi • Testnet)
    </button>

    <div class="log" id="log"></div>
  </div>

<script>
  const logBox = document.getElementById("log");
  const authBtn = document.getElementById("authBtn");
  const payBtn  = document.getElementById("payBtn");

  function log(message) {
    console.log(message);
    logBox.textContent += message + "\n";
  }

  // ✅ Initialize Pi SDK (REQUIRED)
  document.addEventListener("DOMContentLoaded", () => {
    if (!window.Pi) {
      log("❌ Pi SDK not detected. Open this app in Pi Browser.");
      return;
    }

    Pi.init({
      version: "2.0",
      sandbox: true   // testnet
    });

    log("✅ Pi SDK initialized (Testnet)");
  });

  // ✅ AUTHENTICATION (USER CLICK ONLY)
  authBtn.onclick = async () => {
    try {
      log("🔐 Authenticating user...");

      const scopes = ["username", "payments"];

      const authResult = await Pi.authenticate(scopes, () => {
        log("⚠️ Incomplete payment found");
      });

      log("✅ Authentication successful");
      log("👤 Username: " + authResult.user.username);

      authBtn.disabled = true;
      payBtn.disabled = false;

    } catch (err) {
      log("❌ Authentication failed");
      log(JSON.stringify(err));
    }
  };

  // ✅ PAYMENT (USER CLICK ONLY)
  payBtn.onclick = async () => {
    try {
      log("💰 Creating payment...");

      const paymentData = {
        amount: 0.01,
        memo: "UNHCR.pi Utility Access (Testnet)",
        metadata: {
          service: "utility_access"
        }
      };

      const callbacks = {

        // 🔴 REQUIRED: call your backend
        onReadyForServerApproval: async (paymentId) => {
          log("🟡 Server approval required");
          log("Payment ID: " + paymentId);

          await fetch(
            "https://unhcr-pi.onrender.com/payments/process",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ paymentId })
            }
          );
        },

        // 🔴 REQUIRED: complete on backend
        onReadyForServerCompletion: async (paymentId, txid) => {
          log("🟢 Server completion required");
          log("TXID: " + txid);

          await fetch(
            "https://unhcr-pi.onrender.com/payments/process",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ paymentId, txid })
            }
          );

          log("✅ Payment fully processed");
        },

        onCancel: () => {
          log("❌ Payment cancelled by user");
        },

        onError: (err) => {
          log("❌ Payment error");
          log(JSON.stringify(err));
        }
      };

      await Pi.createPayment(paymentData, callbacks);

    } catch (err) {
      log("❌ Payment creation failed");
      log(JSON.stringify(err));
    }
  };
</script>
</body>
</html>

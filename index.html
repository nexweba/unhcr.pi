<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>UNHCR.pi</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <h2>UNHCR.pi Utility Access</h2>
  <button id="payBtn">Unlock Access (0.01 Pi)</button>

  <script>
    Pi.init({ version: "2.0", sandbox: true });

    document.getElementById("payBtn").onclick = async () => {
      try {
        // 1️⃣ Authenticate
        const auth = await Pi.authenticate(["payments"], onIncompletePaymentFound);
        console.log("Authenticated:", auth.user.username);

        // 2️⃣ Create payment ONLY if no incomplete one exists
        const payment = await Pi.createPayment({
          amount: 0.01,
          memo: "UNHCR.pi Utility Access (Testnet)",
          metadata: { app: "UNHCR.pi" }
        });

        console.log("Payment created:", payment);

        // 3️⃣ Send paymentId to backend
        await fetch("https://unhcr-pi.onrender.com/payments/process", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ paymentId: payment.identifier })
        });

        alert("Payment completed successfully");

      } catch (err) {
        console.error("Payment error:", err);
      }
    };

    // 🔑 THIS IS CRITICAL
    async function onIncompletePaymentFound(payment) {
      console.warn("Incomplete payment found:", payment.identifier);

      // 👉 DO NOT create another payment
      await fetch("https://unhcr-pi.onrender.com/payments/process", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paymentId: payment.identifier })
      });

      alert("Previous payment completed");
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UNHCR.pi</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

<h2>UNHCR.pi Utility Access (Testnet)</h2>

<button id="authBtn">Authenticate with Pi</button>
<button id="payBtn" disabled>Unlock Access (0.01 Pi)</button>

<pre id="log"></pre>

<script>
const logBox = document.getElementById("log");
const authBtn = document.getElementById("authBtn");
const payBtn  = document.getElementById("payBtn");

function log(msg) {
  logBox.textContent += msg + "\n";
}

// 1️⃣ Init Pi SDK
document.addEventListener("DOMContentLoaded", () => {
  Pi.init({ version: "2.0", sandbox: true });
  log("✅ Pi SDK initialized (Testnet)");
});

// 2️⃣ Authenticate
authBtn.onclick = async () => {
  try {
    const auth = await Pi.authenticate(
      ["username", "payments"],
      onIncompletePaymentFound
    );

    log("✅ Authenticated: " + auth.user.username);
    authBtn.disabled = true;
    payBtn.disabled = false;

  } catch (err) {
    log("❌ Auth failed");
  }
};

// 3️⃣ Create payment (ONLY on click)
payBtn.onclick = async () => {
  try {
    await Pi.createPayment(
      {
        amount: 0.01,
        memo: "UNHCR.pi Utility Access (Testnet)",
        metadata: { service: "utility_access" }
      },
      {
        onReadyForServerApproval: async (paymentId) => {
          log("🟡 Approving payment: " + paymentId);

          await fetch("https://unhcr-pi.onrender.com/payments/process", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paymentId })
          });
        },

        onReadyForServerCompletion: async (paymentId, txid) => {
          log("🟢 Completing payment");

          await fetch("https://unhcr-pi.onrender.com/payments/process", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paymentId, txid })
          });

          log("✅ Payment completed");
          alert("Access unlocked!");
        },

        onCancel: () => log("❌ User cancelled"),
        onError: () => log("❌ Payment error")
      }
    );
  } catch {
    log("❌ Payment creation failed");
  }
};

// 4️⃣ Handle incomplete payments (NO new payment)
async function onIncompletePaymentFound(payment) {
  log("⚠️ Completing previous payment");

  await fetch("https://unhcr-pi.onrender.com/payments/process", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ paymentId: payment.identifier })
  });

  log("✅ Previous payment resolved");
}
</script>

</body>
</html>

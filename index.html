<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UNHCR.pi | Pi-Native Utilities</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --text: #0f172a;
      --muted: #64748b;
      --bg: #f8fafc;
      --card: #ffffff;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05);
      text-align: center;
    }

    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      margin-top: 28px;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    .note {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="logo">π</div>

      <h1>UNHCR.pi</h1>

      <p>
        A Pi Network ecosystem application providing Pi-native
        web naming utilities, structured digital tools,
        and domain-based services designed for scalable use.
      </p>

      <button onclick="unlock()">
        Unlock Utility Access (0.01 Pi • Testnet)
      </button>

      <div class="note">
        Pi Testnet only • No real funds • Optional utility access
      </div>
    </div>
  </div>

<script>
  Pi.init({ version: "2.0", sandbox: true });

  async function unlock() {
    const auth = await Pi.authenticate(["payments", "username"]);

    Pi.createPayment(
      {
        amount: 0.01,
        memo: "Utility Access – UNHCR.pi",
        metadata: {
          app: "unhcr.pi",
          purpose: "utility_access"
        }
      },
      {
        onReadyForServerApproval: async (paymentId) => {
          await fetch("/functions/approve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paymentId })
          });
        },
        onReadyForServerCompletion: async (paymentId, txid) => {
          await fetch("/functions/complete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paymentId, txid })
          });
          alert("Utility access unlocked successfully.");
        }
      }
    );
  }
</script>
</body>
</html>
